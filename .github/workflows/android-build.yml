
name: ReyCreate Blender Touch Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - reycreate-dev

jobs:
  build:
    name: Galaxy Tab S9 ARM64 Lite
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      # ==========================================
      # 1. CHECKOUT SOURCE
      # ==========================================

      - name: Checkout source
        uses: actions/checkout@v4
        with:
          lfs: false
          submodules: false

      # ==========================================
      # 2. INSTALL DEPENDENCIES
      # ==========================================

      - name: Install dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            build-essential gcc-14 g++-14 \
            cmake ninja-build git-lfs patchelf \
            zip unzip bison flex python3 \
            python3-pip openjdk-17-jdk pkg-config \
            libxi-dev

      # ==========================================
      # 3. JAVA SETUP
      # ==========================================

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ==========================================
      # 4. ANDROID SDK SETUP
      # ==========================================

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      # ==========================================
      # 5. INSTALL ANDROID SDK AND NDK
      # ==========================================

      - name: Install Android SDK and NDK
        run: |
          set -euo pipefail

          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"

          echo "Android SDK location: $SDK_ROOT"

          which sdkmanager
          sdkmanager --version

          mkdir -p "$SDK_ROOT"

          echo "Accepting Android SDK licenses..."
          sdkmanager --sdk_root="$SDK_ROOT" --licenses

          echo "Checking Platform-Tools..."

          if [ -d "$SDK_ROOT/platform-tools" ]; then
            ls -la "$SDK_ROOT/platform-tools"
          else
            echo "Platform-Tools directory not found."
          fi

          echo "Installing Android platform and NDK..."

          sdkmanager --sdk_root="$SDK_ROOT" --verbose --channel=3 \
            "platforms;android-35" \
            "build-tools;35.0.1" \
            "ndk;30.0.14904198"

          echo "Checking installed packages..."
          sdkmanager --sdk_root="$SDK_ROOT" --list_installed

          echo "Checking NDK..."

          test -f "$SDK_ROOT/ndk/30.0.14904198/build/cmake/android.toolchain.cmake"

          echo "Creating NDK compatibility path..."

          ln -sfn "$SDK_ROOT/ndk/30.0.14904198" \
            "$SDK_ROOT/ndk/30.0.14904198-beta1"

          test -f "$SDK_ROOT/ndk/30.0.14904198-beta1/build/cmake/android.toolchain.cmake"

          echo "Preparing Blender SDK path..."

          rm -rf "$HOME/android-sdk"
          ln -s "$SDK_ROOT" "$HOME/android-sdk"

          echo "ANDROID_HOME=$HOME/android-sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> "$GITHUB_ENV"

          echo "Android SDK setup completed."

      # ==========================================
      # 6. VERIFY BUILD TOOLS
      # ==========================================

      - name: Verify build tools
        run: |
          set -euo pipefail

          echo "Checking Ninja..."
          command -v ninja
          ninja --version

          echo "Checking CMake..."
          cmake --version

          echo "Checking GCC..."
          gcc-14 --version
          g++-14 --version

          echo "Checking Android NDK..."
          test -f "$HOME/android-sdk/ndk/30.0.14904198-beta1/build/cmake/android.toolchain.cmake"

          echo "All build tools verified."

      # ==========================================
      # 7. CONFIGURE GIT LFS
      # ==========================================

      - name: Configure Git LFS
        run: |
          set -euo pipefail

          git lfs install

          git config --local lfs.url \
            https://projects.blender.org/blender/blender.git/info/lfs

          git lfs pull

      # ==========================================
      # 8. INITIALIZE REQUIRED SUBMODULES
      # ==========================================

      - name: Initialize required submodules
        run: |
          set -euo pipefail

          git -c submodule.lib/linux_x64.update=checkout \
              -c submodule.lib/android_arm64.update=checkout \
              submodule update --init \
              lib/linux_x64 lib/android_arm64

          echo "Downloading host libraries..."
          git -C lib/linux_x64 lfs pull

          echo "Downloading Android ARM64 libraries..."
          git -C lib/android_arm64 lfs pull

      # ==========================================
      # 9. INSTALL VULKAN HEADERS
      # ==========================================

      - name: Install Vulkan headers
        run: |
          set -euo pipefail

          git clone --depth 1 --branch v1.4.341 \
            https://github.com/KhronosGroup/Vulkan-Headers.git \
            "$RUNNER_TEMP/Vulkan-Headers"

          mkdir -p ../blender_build_android/lib/vulkan_headers

          cp -a "$RUNNER_TEMP/Vulkan-Headers/include" \
            ../blender_build_android/lib/vulkan_headers/

          echo "Vulkan headers installed."

      # ==========================================
      # 10. CLEAN AND REBUILD BLENDER LITE
      # ==========================================

      - name: Clean and Build Lite APK
        id: blender_build
        continue-on-error: true
        run: |
          set -o pipefail

          echo "=========================================="
          echo "REYCREATE BLENDER ANDROID CLEAN BUILD"
          echo "=========================================="

          echo "Configuration: Lite"
          echo "Architecture: ARM64"
          echo "Build mode: Clean"

          python3 build_files/android/build.py lite --clean 2>&1 | tee "$RUNNER_TEMP/blender-build.log"

      # ==========================================
      # 11. DIAGNOSE BUILD FAILURE
      # ==========================================

      - name: Diagnose failed build
        if: steps.blender_build.outcome == 'failure'
        run: |
          echo "=========================================="
          echo "ORIGINAL BUILD ERROR DETAILS"
          echo "=========================================="

          if [ -f "$RUNNER_TEMP/blender-build.log" ]; then

            echo "Searching for CMake and compiler errors..."

            grep -in -B 20 -A 35 -E \
              "CMake Error|Could NOT find|not found|FAILED:|error:|fatal error|Generate step failed|subcommand failed" \
              "$RUNNER_TEMP/blender-build.log" | tail -n 300 || true

            echo "=========================================="
            echo "LAST 250 BUILD LOG LINES"
            echo "=========================================="

            tail -n 250 "$RUNNER_TEMP/blender-build.log"

          fi

          echo "=========================================="
          echo "CMAKE ERROR LOGS"
          echo "=========================================="

          find .. -type f \( \
            -name "CMakeError.log" -o \
            -name "CMakeOutput.log" -o \
            -name "CMakeConfigureLog.yaml" \
          \) -print 2>/dev/null || true

          find .. -type f \( \
            -name "CMakeError.log" -o \
            -name "CMakeConfigureLog.yaml" \
          \) -exec sh -c '
            echo "========== $1 =========="
            tail -n 150 "$1"
          ' _ {} \; 2>/dev/null || true

          echo "=========================================="
          echo "DIAGNOSTICS COMPLETE"
          echo "=========================================="

      # ==========================================
      # 12. PRESERVE FAILED BUILD STATUS
      # ==========================================

      - name: Fail workflow if Blender build failed
        if: steps.blender_build.outcome == 'failure'
        run: |
          echo "Blender Android Lite build failed."
          exit 1

      # ==========================================
      # 13. UPLOAD APK
      # ==========================================

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ReyCreate-Blender-Touch-Lite-ARM64
          path: ../blender_build_android/android_apk_stage_lite/blender-lite.apk
          if-no-files-found: error
          retention-days: 14
